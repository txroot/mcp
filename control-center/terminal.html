<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Terminal · MCP Control Center</title>
<link rel="stylesheet" href="/static/xterm.css">
<style>
:root{color-scheme:dark;--bg:#080d15;--panel:#0f1724;--line:#243247;--soft:#1a2637;--text:#f3f6fb;--muted:#8e9db2;--green:#67d58a;--red:#ff6f7d;--blue:#5f8fff}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:#080d15;color:var(--text);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}
.app{height:100%;display:grid;grid-template-rows:52px 1fr}.top{display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--line);background:#0f1724}.back,.btn{border:1px solid #33445d;background:#131d2b;color:#dfe8f4;border-radius:9px;padding:7px 10px;font-weight:650;font-size:12px;text-decoration:none;cursor:pointer}.btn:hover,.back:hover{background:#182436}.btn.danger{color:#ff9da6}.title{font-weight:760;font-size:15px}.spacer{flex:1}.status{font-size:12px;color:var(--muted)}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--red);margin-right:6px}.dot.on{background:var(--green)}
.layout{min-height:0;display:grid;grid-template-columns:270px 1fr}.side{border-right:1px solid var(--line);background:#0b111a;padding:12px;overflow:auto}.sidehead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.sidehead b{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#8293a9}.sessions{display:grid;gap:7px}.session{border:1px solid #26344a;background:#101926;border-radius:10px;padding:10px;cursor:pointer}.session:hover{border-color:#40516b}.session.active{border-color:#5f8fff;background:#13203a}.sname{font-weight:720}.smeta{color:var(--muted);font-size:10px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.empty{color:var(--muted);font-size:12px;padding:8px}
.main{min-width:0;min-height:0;display:grid;grid-template-rows:auto 1fr}.bar{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);background:#0d1520}.bar .meta{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bar .grow{flex:1}.terminal-wrap{min-height:0;background:#070b11;padding:8px}.terminal-host{width:100%;height:100%}.xterm{height:100%;padding:6px}.xterm-viewport{border-radius:4px}
.modal{position:fixed;inset:0;background:rgba(2,5,9,.76);display:none;align-items:center;justify-content:center;z-index:50}.modal.show{display:flex}.box{width:min(560px,92vw);background:#0f1724;border:1px solid #334158;border-radius:14px;padding:16px;box-shadow:0 30px 100px #000}.box h3{margin:0 0 14px}.field{display:grid;gap:5px;margin:10px 0}.field label{font-size:11px;color:var(--muted)}.field input{width:100%;border:1px solid #334158;background:#09111c;color:var(--text);padding:9px 10px;border-radius:9px;font:12px ui-monospace,monospace}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.notice{position:fixed;right:18px;bottom:18px;max-width:420px;background:#111a27;border:1px solid #33425b;border-radius:10px;padding:10px 12px;display:none;z-index:60}.notice.show{display:block}.notice.bad{border-color:#6b3039;color:#ffadb4}
@media(max-width:760px){.layout{grid-template-columns:1fr}.side{display:none}.top{padding:0 10px}.title{display:none}}
</style>
</head>
<body><div class="app">
<div class="top"><a class="back" href="/">← MCP Control Center</a><span class="title">Interactive Terminal</span><div class="spacer"></div><span id="serviceStatus" class="status"><span class="dot"></span>Connecting</span><button class="btn" onclick="showNew()">New Terminal</button></div>
<div class="layout"><aside class="side"><div class="sidehead"><b>Sessions</b><button class="btn" onclick="refreshSessions()">Refresh</button></div><div id="sessions" class="sessions"></div></aside>
<main class="main"><div class="bar"><div id="activeMeta" class="meta">No terminal attached</div><div class="grow"></div><button class="btn" onclick="sendSignal('INT')">Ctrl+C</button><button class="btn" onclick="sendSignal('TERM')">TERM</button><button class="btn danger" onclick="closeSession()">Close</button></div><div class="terminal-wrap"><div id="terminal" class="terminal-host"></div></div></main></div>
</div>
<div id="newModal" class="modal"><div class="box"><h3>New Terminal</h3><div class="field"><label>Name</label><input id="newName" value="Terminal"></div><div class="field"><label>Working directory (inside your home)</label><input id="newCwd" value="__HOME__"></div><div class="field"><label>Command (leave blank for interactive shell)</label><input id="newCommand" placeholder="e.g. idf.py monitor"></div><div class="actions"><button class="btn" onclick="hideNew()">Cancel</button><button class="btn" onclick="createSession()">Create</button></div></div></div>
<div id="notice" class="notice"></div>
<script src="/static/xterm.js"></script><script src="/static/addon-fit.js"></script>
<script>
const TOKEN=__TOKEN__;
const term=new Terminal({cursorBlink:true,scrollback:10000,fontFamily:'ui-monospace,SFMono-Regular,Menlo,Consolas,monospace',fontSize:13,theme:{background:'#070b11',foreground:'#dce5f1',cursor:'#8fb1ff',selectionBackground:'#304563'}});
const fit=new FitAddon.FitAddon();term.loadAddon(fit);term.open(document.getElementById('terminal'));fit.fit();
let active=null,cursor=null,polling=false,sessions=[];
const headers={'Content-Type':'application/json','X-MCP-Control-Token':TOKEN};
function note(msg,bad=false){const n=document.getElementById('notice');n.textContent=msg;n.className='notice show'+(bad?' bad':'');setTimeout(()=>n.className='notice',3600)}
async function api(path,opts={}){const r=await fetch(path,{cache:'no-store',...opts,headers:{...headers,...(opts.headers||{})}});const d=await r.json();if(!r.ok)throw new Error(d.error||d.message||r.statusText);return d}
function renderSessions(){const root=document.getElementById('sessions');if(!sessions.length){root.innerHTML='<div class="empty">No sessions yet.</div>';return}root.innerHTML=sessions.map(s=>`<div class="session ${s.session_id===active?'active':''}" onclick="attach('${s.session_id}')"><div class="sname"><span class="dot ${s.state==='running'?'on':''}"></span>${esc(s.name)}</div><div class="smeta">${esc(s.session_id)} · PID ${s.pid} · ${esc(s.cwd)}</div></div>`).join('')}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function refreshSessions(){try{const d=await api('/api/terminal/sessions');sessions=d.sessions||[];renderSessions();document.getElementById('serviceStatus').innerHTML='<span class="dot on"></span>Terminal MCP online';if(active){const s=sessions.find(x=>x.session_id===active);if(s)document.getElementById('activeMeta').textContent=`${s.name} · ${s.session_id} · PID ${s.pid} · ${s.cwd}`}}catch(e){document.getElementById('serviceStatus').innerHTML='<span class="dot"></span>Terminal MCP offline';note(String(e),true)}}
async function attach(sid){active=sid;cursor=null;term.reset();term.writeln('\x1b[38;5;75mAttached to '+sid+'\x1b[0m');renderSessions();const s=sessions.find(x=>x.session_id===sid);if(s)document.getElementById('activeMeta').textContent=`${s.name} · ${s.session_id} · PID ${s.pid} · ${s.cwd}`;fitAndResize();await poll()}
async function poll(){if(polling||!active)return;polling=true;try{let url='/api/terminal/read?session_id='+encodeURIComponent(active);if(cursor!==null)url+='&after='+cursor;const d=await api(url);cursor=d.cursor;if(d.output)term.write(d.output);if(d.has_more)setTimeout(poll,0)}catch(e){note('Read failed: '+e,true)}finally{polling=false}}
term.onData(async data=>{if(!active)return;try{await api('/api/terminal/write',{method:'POST',body:JSON.stringify({session_id:active,text:data})})}catch(e){note('Write failed: '+e,true)}});
let resizeTimer;function fitAndResize(){clearTimeout(resizeTimer);resizeTimer=setTimeout(async()=>{fit.fit();if(active)try{await api('/api/terminal/resize',{method:'POST',body:JSON.stringify({session_id:active,rows:term.rows,cols:term.cols})})}catch{}},80)}window.addEventListener('resize',fitAndResize);
function showNew(){document.getElementById('newModal').classList.add('show');document.getElementById('newName').focus()}function hideNew(){document.getElementById('newModal').classList.remove('show')}
async function createSession(){try{fit.fit();const d=await api('/api/terminal/create',{method:'POST',body:JSON.stringify({name:document.getElementById('newName').value,cwd:document.getElementById('newCwd').value,command:document.getElementById('newCommand').value||null,rows:term.rows,cols:term.cols})});hideNew();await refreshSessions();attach(d.session_id)}catch(e){note('Create failed: '+e,true)}}
async function sendSignal(sig){if(!active)return;try{await api('/api/terminal/signal',{method:'POST',body:JSON.stringify({session_id:active,signal:sig})})}catch(e){note('Signal failed: '+e,true)}}
async function closeSession(){if(!active||!confirm('Close '+active+'?'))return;try{await api('/api/terminal/close',{method:'POST',body:JSON.stringify({session_id:active})});active=null;cursor=null;term.reset();document.getElementById('activeMeta').textContent='No terminal attached';await refreshSessions()}catch(e){note('Close failed: '+e,true)}}
refreshSessions().then(()=>{const running=sessions.find(x=>x.state==='running');if(running)attach(running.session_id)});setInterval(()=>{refreshSessions();poll()},400);
</script></body></html>
