name: Sofia Control Center CI

on:
  push:
    branches:
      - main
      - feature/sofia-control-center-gateway
    paths:
      - "control-center/**"
      - ".github/workflows/sofia-control-center-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "control-center/**"
      - ".github/workflows/sofia-control-center-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sofia-control-center-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Control Center
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: control-center/requirements-ci.txt

      - name: Install CI dependencies
        run: python -m pip install --requirement control-center/requirements-ci.txt

      - name: Compile Python modules
        run: |
          python -m py_compile \
            control-center/server.py \
            control-center/sofia_provider.py \
            control-center/sofia_registry.py \
            control-center/sofia_runtime_inventory.py \
            control-center/sofia_provider_inventory.py \
            control-center/sofia_source_health.py \
            control-center/sofia_gateway_health.py \
            control-center/sofia_gateway_client.py \
            control-center/sofia_lifecycle.py \
            control-center/sofia_health.py \
            control-center/sofia_ui.py \
            control-center/sofia_server.py \
            control-center/gateway/provider_inventory.py \
            control-center/gateway/provider_inventory_resolvers.py \
            control-center/gateway/provider_status_client.py \
            control-center/gateway/provider_inventory_smoke.py \
            control-center/gateway/canary/apply_overlay.py

      - name: Validate reconciled registry and Gateway provider inventory
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path

          sys.path.insert(0, "control-center")
          from gateway.provider_inventory import build_gateway_provider_inventory
          from gateway.provider_inventory_resolvers import (
              build_gateway_tool_resolvers,
              canonical_status_tools,
              intentionally_unresolved_components,
              validate_resolver_contract,
          )
          from gateway.provider_status_client import allowed_status_tools
          from sofia_gateway_client import DEFAULT_GATEWAY_MCP_URL, _ALLOWED_TOOLS
          from sofia_gateway_health import DEFAULT_GATEWAY_READY_URL
          from sofia_registry import load_control_center_registry
          from sofia_runtime_inventory import load_runtime_inventory

          assert DEFAULT_GATEWAY_READY_URL == "http://127.0.0.1:8770/ready"
          assert DEFAULT_GATEWAY_MCP_URL == "http://127.0.0.1:8770/mcp"
          assert "gateway_provider_inventory" in _ALLOWED_TOOLS

          legacy = {
              "host-tools": {},
              "google-tasks": {},
              "memory": {},
              "google-analytics": {},
              "prestashop": {},
          }
          result = load_control_center_registry(
              legacy_registry=legacy,
              providers_dir=Path("control-center/providers"),
              home=Path("/tmp/sofia-ci"),
          )
          assert result.registry == {}
          assert result.migrated_ids == ()
          assert result.suppressed_ids == (
              "google-analytics",
              "google-tasks",
              "host-tools",
              "memory",
              "prestashop",
          )

          inventory = load_runtime_inventory(
              Path("control-center/runtime/sofia-os-canonical.json")
          )
          domains = {domain.domain_id: domain for domain in inventory.domains}
          assert len(domains) == 13
          assert "prestashop" in domains
          assert "mail" in domains
          assert "trello" in domains
          assert "memory" not in domains
          assert "google-analytics" not in domains
          assert all(
              component.lifecycle_enabled is False
              for domain in inventory.domains
              for component in domain.components
          )

          validate_resolver_contract(inventory)
          status_tools = canonical_status_tools()
          assert len(status_tools) == 24
          assert intentionally_unresolved_components() == (
              "prestashop/product-description-write",
              "trello/readwrite",
          )
          assert set(allowed_status_tools()) == set(status_tools.values())
          resolvers = build_gateway_tool_resolvers(
              inventory,
              lambda tool_name, arguments: {"status": "READY", "tool": tool_name},
          )
          assert len(resolvers) == 24
          assert resolvers["mail/read"]()["tool"] == "mail.read.status"

          live = build_gateway_provider_inventory(
              inventory,
              {
                  "sofia-core/gateway": lambda: {"status": "READY"},
                  "mail/read": lambda: {"auth_ready": True, "read_ready": True},
              },
          )
          assert live["authority"] == "sofia-os-gateway"
          assert live["mode"] == "read_only"
          assert live["summary"]["domains"] == 13
          assert live["summary"]["healthy"] == 2
          assert all(
              component["lifecycle"] == {"enabled": False, "actions": []}
              for domain in live["domains"]
              for component in domain["components"]
          )

          server = Path("control-center/sofia_server.py").read_text(encoding="utf-8")
          assert "legacy.service_action = _direct_lifecycle_disabled" in server
          assert "gateway_provider_inventory_probe" in server
          assert 'payload["runtime_inventory_status"]' in server
          assert not Path("control-center/gateway/provider_lifecycle_runner.py").exists()
          assert not Path("control-center/gateway/provider_lifecycle_actions.py").exists()

          print(
              f"suppressed={','.join(result.suppressed_ids)} "
              f"domains={len(domains)} "
              f"gateway_inventory=read_only "
              f"resolvers={len(resolvers)} "
              f"unresolved={len(intentionally_unresolved_components())} "
              f"lifecycle_policy={inventory.lifecycle_policy}"
          )
          PY

      - name: Run unit tests
        run: python -m pytest control-center/tests -q

      - name: Validate JSON inventory
        run: python -m json.tool control-center/runtime/sofia-os-canonical.json >/dev/null

      - name: Validate shell syntax
        run: |
          bash -n control-center/scripts/install_local.sh
          bash -n control-center/gateway/canary/build_smoke_canary.sh
