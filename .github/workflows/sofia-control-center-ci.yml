name: Sofia Control Center CI

on:
  push:
    branches:
      - main
      - feature/sofia-control-center-gateway
    paths:
      - "control-center/**"
      - ".github/workflows/sofia-control-center-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "control-center/**"
      - ".github/workflows/sofia-control-center-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sofia-control-center-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Control Center
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: control-center/requirements-ci.txt

      - name: Install CI dependencies
        run: python -m pip install --requirement control-center/requirements-ci.txt

      - name: Compile Python modules
        run: |
          python -m py_compile \
            control-center/server.py \
            control-center/sofia_provider.py \
            control-center/sofia_registry.py \
            control-center/sofia_server.py

      - name: Validate provider manifests
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path

          sys.path.insert(0, "control-center")
          from sofia_registry import load_control_center_registry

          result = load_control_center_registry(
              legacy_registry={},
              providers_dir=Path("control-center/providers"),
              home=Path("/tmp/sofia-ci"),
          )

          assert "provider:prestashop/001" in result.manifests
          assert result.migrated_ids == ("prestashop",)
          assert result.registry["prestashop"]["provider_manifest"]["gateway_required"] is True
          assert result.registry["prestashop"]["provider_manifest"]["direct_external_exposure"] is False
          print(f"validated_manifests={len(result.manifests)} migrated={','.join(result.migrated_ids)}")
          PY

      - name: Run unit tests
        run: python -m pytest control-center/tests -q

      - name: Validate installer shell syntax
        run: bash -n control-center/scripts/install_local.sh
