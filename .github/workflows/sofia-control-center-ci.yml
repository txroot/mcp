name: Sofia Control Center CI

on:
  push:
    branches:
      - main
      - feature/sofia-control-center-gateway
    paths:
      - "control-center/**"
      - ".github/workflows/sofia-control-center-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "control-center/**"
      - ".github/workflows/sofia-control-center-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sofia-control-center-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Control Center
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: control-center/requirements-ci.txt

      - name: Install CI dependencies
        run: python -m pip install --requirement control-center/requirements-ci.txt

      - name: Compile Python modules
        run: |
          python -m py_compile \
            control-center/server.py \
            control-center/sofia_provider.py \
            control-center/sofia_registry.py \
            control-center/sofia_source_health.py \
            control-center/sofia_gateway_health.py \
            control-center/sofia_gateway_client.py \
            control-center/sofia_lifecycle.py \
            control-center/sofia_health.py \
            control-center/sofia_ui.py \
            control-center/sofia_server.py \
            control-center/gateway/provider_lifecycle_runner.py \
            control-center/gateway/provider_lifecycle_actions.py

      - name: Validate provider manifests and lifecycle contract
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path

          sys.path.insert(0, "control-center")
          from gateway.provider_lifecycle_actions import build_provider_lifecycle_actions
          from sofia_gateway_client import DEFAULT_GATEWAY_MCP_URL
          from sofia_gateway_health import DEFAULT_GATEWAY_READY_URL
          from sofia_registry import load_control_center_registry

          assert DEFAULT_GATEWAY_READY_URL == "http://127.0.0.1:8770/ready"
          assert DEFAULT_GATEWAY_MCP_URL == "http://127.0.0.1:8770/mcp"

          result = load_control_center_registry(
              legacy_registry={},
              providers_dir=Path("control-center/providers"),
              home=Path("/tmp/sofia-ci"),
          )
          assert result.migrated_ids == ("google-analytics", "memory", "prestashop")

          expected_lifecycle = {
              registry_id: {
                  "start": f"provider.{registry_id}.start",
                  "stop": f"provider.{registry_id}.stop",
                  "restart": f"provider.{registry_id}.restart",
              }
              for registry_id in result.migrated_ids
          }
          for registry_id in result.migrated_ids:
              metadata = result.registry[registry_id]["provider_manifest"]
              assert metadata["gateway_required"] is True
              assert metadata["direct_external_exposure"] is False
              assert result.registry[registry_id]["lifecycle_actions"] == expected_lifecycle[registry_id]
              lifecycle_caps = [
                  cap for cap in metadata["capabilities"]
                  if ".lifecycle." in cap["name"]
              ]
              assert len(lifecycle_caps) == 3
              assert all(cap["enforcement"] == "CONTROLLED" for cap in lifecycle_caps)
              assert all(cap["requires_approval"] is True for cap in lifecycle_caps)
              assert all("service_availability" in cap["risks"] for cap in lifecycle_caps)

          assert result.registry["google-analytics"]["source_probe"] == "google_analytics"
          assert result.registry["prestashop"]["source_probe"] == "prestashop"
          assert result.registry["memory"]["source_probe"] == ""
          assert result.registry["memory"]["provider_manifest"]["health_contract"]["source_health"] is False

          broker_actions = build_provider_lifecycle_actions(runner="/runner", interlock="/lock")
          assert set(broker_actions) == {
              value for mapping in expected_lifecycle.values() for value in mapping.values()
          }

          server = Path("control-center/sofia_server.py").read_text(encoding="utf-8")
          assert "legacy.service_action = _direct_lifecycle_disabled" in server
          assert "SofiaHandler" in server
          print(
              f"validated_manifests={len(result.manifests)} "
              f"migrated={','.join(result.migrated_ids)} "
              f"lifecycle_actions={len(broker_actions)}"
          )
          PY

      - name: Run unit tests
        run: python -m pytest control-center/tests -q

      - name: Validate installer shell syntax
        run: bash -n control-center/scripts/install_local.sh
